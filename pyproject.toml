[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-advi-usage"
version = "0.1.0"
description = "Reproduce and analyze a GitHub search for ADVI/VI software usage in PyMC, Pyro, NumPyro, TensorFlow Probability, and Stan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.scripts]
github-advi-usage = "github_advi_usage.cli:main"
github-advi-usage-build = "github_advi_usage.build_vi_github_analysis:main"
github-advi-usage-verify = "github_advi_usage.verify_vi_github_analysis:main"
github-advi-usage-manual-review = "github_advi_usage.manual_review:main"
github-advi-usage-random-review = "github_advi_usage.random_repo_review:main"
github-advi-usage-deep-resolve = "github_advi_usage.github_advi_deep_resolve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["github_advi_usage*"]

[tool.setuptools.package-data]
github_advi_usage = ["*.csv", "*.md", "*.ipynb"]
